  <line x1="44" y1="64" x2="84" y2="64" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="88" x2="84" y2="88" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
</svg>