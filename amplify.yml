version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== PROJECT ROOT DEBUG ==="
        - pwd
        - ls -la
        - echo "=== Clearing ALL caches ==="
        - rm -rf node_modules .next .cache tsconfig.tsbuildinfo package-lock.json
        - rm -rf /tmp/.npm /tmp/.cache
        - export DATABASE_URL="postgresql://neondb_owner:npg_CPbtog2S4hVN@ep-proud-fire-ai5rehvt-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require"
        - export NEXTAUTH_SECRET="your-nextauth-secret-here"
        - export NEXTAUTH_URL="https://developer.d28fa2102uro78.amplifyapp.com"
        - export AUTH_SECRET="your-auth-secret-here"
        - export AUTH_URL="https://developer.d28fa2102uro78.amplifyapp.com"
        - export AUTH_TRUST_HOST="true"
        - export NEXT_PUBLIC_APP_URL="https://developer.d28fa2102uro78.amplifyapp.com"
        - npm install --legacy-peer-deps
    build:
      commands:
        - echo "=== BUILD PHASE DEBUG ==="
        - pwd
        - export DATABASE_URL="postgresql://neondb_owner:npg_CPbtog2S4hVN@ep-proud-fire-ai5rehvt-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require"
        - echo "DATABASE_URL set: $DATABASE_URL"
        - echo "=== Checking Razorpay env vars ==="
        - 'if [ -n "$RAZORPAY_KEY_ID" ]; then echo "RAZORPAY_KEY_ID is set"; else echo "RAZORPAY_KEY_ID is NOT set"; fi'
        - 'if [ -n "$RAZORPAY_KEY_SECRET" ]; then echo "RAZORPAY_KEY_SECRET is set"; else echo "RAZORPAY_KEY_SECRET is NOT set"; fi'
        - echo "=== Generating runtime-env.ts with environment variables ==="
        - node scripts/generate-env.js
        - echo "=== Contents of generated runtime-env.ts ==="
        - cat src/runtime-env.ts
        - echo "=== Starting Next.js build ==="
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths: []
