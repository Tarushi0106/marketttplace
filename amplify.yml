version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Clearing all caches ==="
        - rm -rf node_modules .next .cache tsconfig.tsbuildinfo
        - rm -rf /tmp/.npm /tmp/.cache
        - export DATABASE_URL="postgresql://neondb_owner:npg_5nQ7SFAeTXwK@ep-restless-grass-aiiba51j-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require"
        - export NEXTAUTH_SECRET="your-nextauth-secret-here"
        - export NEXTAUTH_URL="https://developer.d28fa2102uro78.amplifyapp.com"
        - export AUTH_SECRET="your-auth-secret-here"
        - export AUTH_URL="https://developer.d28fa2102uro78.amplifyapp.com"
        - export AUTH_TRUST_HOST="true"
        - npm install --legacy-peer-deps
    build:
      commands:
        - echo "=== Current working directory ==="
        - pwd
        - echo "=== tsconfig.json content ==="
        - cat tsconfig.json
        - echo "=== Checking src directory structure ==="
        - ls -la src/
        - ls -la src/contexts/
        - ls -la src/components/
        - ls -la src/components/ui/
        - echo "=== Checking for any tsconfig or jsconfig files ==="
        - find . -name "tsconfig*.json" -o -name "jsconfig*.json" 2>/dev/null
        - echo "=== Starting Next.js build ==="
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths: []
