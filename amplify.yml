version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --legacy-peer-deps
    build:
      commands:
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL"
        - echo "AUTH_URL=$AUTH_URL"
        - echo "AUTH_TRUST_HOST=$AUTH_TRUST_HOST"
        - echo "DATABASE_URL is set=$(test -n "$DATABASE_URL" && echo yes || echo no)"
        - echo "AUTH_SECRET is set=$(test -n "$AUTH_SECRET" && echo yes || echo no)"
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
